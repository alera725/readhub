name: CI

# Pipeline de validación de ReadHub. Se ejecuta en cada push y en cada Pull
# Request. NO despliega la aplicación.
on:
  push:
  pull_request:

# Cancela ejecuciones anteriores del mismo ref si llega una nueva.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Chequeos rápidos: TypeScript, ESLint y pruebas unitarias (Vitest).
  quality:
    name: Typecheck · ESLint · Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node (con caché de npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Restaura la caché de Turborepo para acelerar tareas repetidas.
      - name: Restaurar caché de Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest (unitarias)
        run: npm run test

  # 2) Pruebas E2E con Playwright (solo si los chequeos pasan).
  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      # Requeridas para que la app web arranque (definir en GitHub → Secrets).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Opcionales — solo para flujos que las usen (p. ej. el asistente):
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Opcionales — para sobrescribir el usuario de prueba (por defecto usa el
      # usuario sembrado en supabase/seed.sql):
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node (con caché de npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Restaura los navegadores de Playwright para evitar re-descargarlos.
      - name: Restaurar caché de navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e

      # Publica el reporte HTML y los artefactos (screenshots/videos/trazas)
      # solo cuando hay fallos.
      - name: Publicar reporte y artefactos (ante fallos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
